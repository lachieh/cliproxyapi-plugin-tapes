name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: tapes

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    # Linux libraries are built on Debian bookworm, the base of the official
    # CLIProxyAPI image, so they never need a newer glibc than the host has.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, container: 'golang:1.26-bookworm', ext: so }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, container: 'golang:1.26-bookworm', ext: so }
          - { goos: darwin, goarch: arm64, runner: macos-15, ext: dylib }
          - { goos: darwin, goarch: amd64, runner: macos-15, ext: dylib, cc: 'clang -arch x86_64' }
          - { goos: windows, goarch: amd64, runner: windows-2025, ext: dll }
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        if: matrix.container == ''
        with:
          go-version-file: go.mod
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "$GITHUB_ENV"
      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: |
          [[ -n "$CC" ]] || unset CC
          mkdir -p dist
          go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "dist/${PLUGIN_ID}.${{ matrix.ext }}" .
      - name: Package
        # The packager runs on the build machine, not the target platform.
        run: GOOS= GOARCH= CGO_ENABLED=0 go run ./scripts/package -library "dist/${PLUGIN_ID}.${{ matrix.ext }}" -archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/checksums.txt
          cat dist/checksums.txt
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/checksums.txt \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
